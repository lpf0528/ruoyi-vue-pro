services:
  yudao-server:
    image: docker.io/eatsleeprun/yudao-server:latest
    container_name: yudao-server
    restart: always
    ports:
      - "48080:48080"
    volumes:
      - /opt/deployments/resources:/config
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # 4G 服务器：堆固定 512m；进程总占用通常约 700MB~1GB（含元空间/直接内存/线程栈）
      - JAVA_OPTS=-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/app/logs/heapdump.hprof -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai -Duser.home=/app
    # 限制容器内存，防止 JVM/原生内存把整机打满；超出后由 Docker OOM Killer 处理
    mem_limit: 1g
    mem_reservation: 768m
    networks:
      - 1panel-network

  yudao-ui:
    image: docker.io/eatsleeprun/yudao-ui-admin-vue3:latest
    container_name: yudao-ui
    restart: always
    ports:
      - "80:80"          # PC 管理后台
    networks:
      - 1panel-network

  yudao-ui-uniapp:
    image: docker.io/eatsleeprun/yudao-ui-admin-uniapp:latest
    container_name: yudao-ui-uniapp
    restart: always
    ports:
      - "8080:80"        # 移动端 H5（80 已被 yudao-ui 占用）
    environment:
      # 同一 Docker 网络内，用服务名访问后端，不要用 127.0.0.1
      BACKEND_HOST: yudao-server
      BACKEND_PORT: 48080
    depends_on:
      - yudao-server
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true