name: 后端 - 构建推送并部署（DockerHub版）

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.image/**'
      - 'sql/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub 固定 registry
  REGISTRY: docker.io

  # Docker Hub 仓库名
  # 格式：dockerhub用户名/仓库名
  IMAGE_NAME: eatsleeprun/yudao-server

  JAVA_VERSION: '8'

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest

    outputs:
      image_full: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      # ── 1. 检出代码 ─────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v4

      # ── 2. JDK + Maven Cache ───────────────────
      - name: 配置 JDK（含 Maven 缓存）
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Maven Build ─────────────────────────
      - name: Maven 构建
        run: |
          mvn clean package \
            --settings .github/maven/settings.xml \
            -DskipTests \
            -T 1C \
            -B \
            --no-transfer-progress

      # ── 4. Docker Buildx ───────────────────────
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Docker Meta ─────────────────────────
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'master' || github.ref_name == 'main' }}

          labels: |
            org.opencontainers.image.title=yudao-server
            org.opencontainers.image.description=芋道后端服务
            org.opencontainers.image.revision=${{ github.sha }}

      # ── 6. 登录 Docker Hub ─────────────────────
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 7. Build & Push ────────────────────────
      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          platforms: linux/amd64

          # Registry Cache
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

          provenance: false
          sbom: false

      # ── 8. Summary ─────────────────────────────
      - name: 输出构建结果
        run: |
          echo "## 🚀 镜像推送成功" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

          echo "**标签：**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY