# 后端 CI/CD 工作流：负责将 yudao-server 打包为 Docker 镜像，
# 推送到华为云 SWR 镜像服务，并在 master-jdk25 分支自动 SSH 部署到线上服务器。
# 触发条件：仅 push 到 master-jdk25 分支时触发，且改动不仅限于文档、SQL 等忽略路径。
name: 后端 - 构建推送并部署（华为云 SWR版）
on:
  push:
    branches:
      - master-jdk25
    # 仅修改以下路径时不触发构建，减少无意义的流水线运行
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.image/**'
      - 'sql/**'
# 并发控制：同一分支同一 workflow 只保留最新一次运行，
# 新的 push 会自动取消正在进行中的旧任务，避免资源浪费和镜像覆盖冲突
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# 全局环境变量，供下方所有 job/step 引用
env:
  REGISTRY: swr.cn-south-1.myhuaweicloud.com                     # 华为云 SWR 镜像仓库地址 (华南-广州)
  SWR_ORGANIZATION: zhicang                             # 华为云 SWR 组织名称 (请根据实际组织名修改)
  IMAGE_NAME: swr.cn-south-1.myhuaweicloud.com/zhicang/yudao-server     # 镜像完整名称（含 SWR 域名与组织名称）
  JAVA_VERSION: '25'                                          # 构建所使用的 JDK 版本

jobs:
  # ============ Job 1：构建 Maven 项目并生成 Docker 镜像包 ============
  build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库代码到 CI 运行环境
      - name: 检出代码
        uses: actions/checkout@v4

      # 安装指定版本 JDK，并自动缓存本地 Maven 仓库（~/.m2）以加速后续构建
      - name: 配置 JDK（含 Maven 缓存）
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # 执行 Maven 全量构建：跳过测试、多线程编译（-T 1C）、批量模式、不打印下载进度
      - name: Maven 构建
        run: |
          mvn clean install \
            -DskipTests \
            -T 1C \
            -B \
            --no-transfer-progress

      # 启用 Docker Buildx，为跨平台构建及构建缓存提供支持
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 根据分支、commit sha 等信息自动生成镜像 tag 与 OCI 标签
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'master-jdk25' }}
          labels: |
            org.opencontainers.image.title=yudao-server
            org.opencontainers.image.description=芋道后端服务
            org.opencontainers.image.revision=${{ github.sha }}

      # 基于根目录 Dockerfile 构建镜像导出为本地 tar 文件（暂不推送）
      - name: 构建 Docker 镜像 (离线包)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/yudao-server.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # 上传构建导出的镜像 tar 文件作为 Artifact 传递给下一个 Job
      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/yudao-server.tar
          retention-days: 1

  # ============ Job 2：推送到华为云 SWR 镜像仓库 ============
  push:
    name: 推送镜像到 SWR
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 下载 Job 1 打包生成的镜像包
      - name: 下载镜像产物
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      # 将离线包导入本地 Docker 引擎
      - name: 加载 Docker 镜像
        run: |
          docker load --input /tmp/yudao-server.tar
          docker image ls

      # 登录华为云 SWR 镜像服务
      - name: 登录华为云 SWR 镜像服务
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      # 推送所有生成的 Tag 镜像至华为云 SWR
      - name: 推送镜像到华为云 SWR
        run: |
          docker push --all-tags ${{ env.IMAGE_NAME }}

      # 输出构建推送结果总结
      - name: 输出构建结果
        run: |
          echo "## 🚀 镜像推送成功 (华为云 SWR)" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 仓库地址 | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像全名 | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============ Job 3：SSH 登录服务器，拉取最新镜像并重启服务 ============
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: push
    if: github.ref_name == 'master-jdk25'
    steps:
      # 通过 appleboy/ssh-action 远程登录服务器（使用用户名 + 密码认证方式）
      # 登录 SWR -> 拉取最新镜像 -> 重启 yudao-server 容器 -> 清理无用旧镜像
      - name: SSH 远程部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SERVER_USERNAME || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          request_pty: true
          script: |
            cd /opt/1panel/docker/compose/zhicang

            echo "▶ 登录华为云 SWR 镜像仓库"
            sudo docker login -u ${{ secrets.SWR_USERNAME }} -p ${{ secrets.SWR_PASSWORD }} ${{ env.REGISTRY }}

            echo "▶ 拉取最新镜像"
            sudo docker compose pull yudao-server

            echo "▶ 重启服务"
            sudo docker compose up -d yudao-server

            echo "▶ 清理旧镜像"
            sudo docker image prune -f

            echo "✅ 后端部署完成。"

      # 将部署结果（镜像地址、目标服务器）写入 Step Summary，便于在 Actions 页面直接查看部署详情
      - name: 输出部署结果
        run: |
          echo "## ✅ 后端部署成功" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | \`${{ env.IMAGE_NAME }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 服务器 | \`${{ secrets.SERVER_HOST }}\` |" >> $GITHUB_STEP_SUMMARY
